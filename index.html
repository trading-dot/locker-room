<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Locker Room — FVCK THE RULES</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="ui.css">
<style>html,body{height:100%;overflow:hidden}[hidden]{display:none!important}
#hud{position:fixed;top:14px;left:16px;font-weight:800;font-size:18px;letter-spacing:.12em;pointer-events:none}#hud small{display:block;color:var(--o);font-size:11px}
#cb{position:fixed;top:12px;right:14px;background:#000a;backdrop-filter:blur(10px)}#cb b{color:var(--o)}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom))}#nav button{padding:8px 13px}
#lab{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);color:#cfd3d6;font-size:13px;letter-spacing:.1em;text-transform:uppercase;pointer-events:none;text-align:center}
#tip{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);padding:8px 16px;font-size:12px;max-width:92vw;text-align:center;border-radius:18px}
#card,#sheet>div{background:#f7f5f0;color:#111;border-radius:18px;padding:16px}
#card{position:fixed;right:14px;top:60px;width:min(300px,calc(100vw - 28px));box-shadow:0 20px 50px #0008;transform:translateX(120%);transition:transform .5s}#card.on{transform:none}
#card small{color:#777;font-size:12px;text-transform:uppercase;letter-spacing:.08em}#card h1{font-size:23px;line-height:1.05;font-weight:800;margin:2px 0}
.top{display:flex;justify-content:space-between;align-items:center}.top button,#cx{font:inherit;border:1px solid #0002;background:#fff;color:#111;border-radius:99px;padding:3px 12px;cursor:pointer}
#sw{display:flex;gap:8px;margin:6px 0 10px}#sw i{width:24px;height:24px;border-radius:50%;border:2px solid #0003;cursor:pointer}#sw i.on{box-shadow:0 0 0 2px #fff,0 0 0 4px #111}
#card .pill{justify-content:center;margin-bottom:10px}#card .pill button{padding:6px 10px}
.sz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}.sz button{font:inherit;padding:9px;border:1px solid #0002;border-radius:10px;background:#fff;color:#111;cursor:pointer}.sz .on{background:#111;color:#fff}
#add{width:100%;padding:13px;border:0;border-radius:99px;background:#111;color:#fff;font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}#add.ok{background:#2f9e44}
#vc{display:block;text-align:center;margin-top:8px;cursor:pointer}
#sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}#sheet>div{width:min(380px,92vw);max-height:80vh;overflow:auto}#sheet h1{margin-bottom:8px}
.ci{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #0002}#sheet .b{margin-top:12px;color:#000}
@media(max-width:700px){#card{top:auto;bottom:66px;right:7px;left:7px;width:auto;max-height:50vh;overflow:auto}}</style></head><body>
<canvas id="c"></canvas>
<div id="hud">FVCK THE RULES<small>LOCKER ROOM · VIRTUAL STORE</small></div>
<button class="b" id="cb">Cart <b id="ct">0</b></button>
<div id="lab"></div><div id="tip" class="pill" hidden>Geser = lihat sekeliling / geser rel · klik tab = pindah zona · klik baju = detail</div>
<div class="pill" id="nav"><button data-t="store" class="on">Store</button><button data-t="hoodie">Hoodie</button><button data-t="kaos">Kaos</button><button data-t="aksesoris">Aksesoris</button><button id="i">i</button></div>
<div id="card"><div class="top"><small id="k"></small><span><button id="pv">←</button> <button id="nx">→</button> <button id="x">×</button></span></div>
<h1 id="n"></h1><div id="p"></div><small id="l"></small><div id="sw"></div>
<div class="pill" id="vw"><button data-r="0" class="on">Depan</button><button data-r="3.1416">Belakang</button><button data-r="1.5708">Kiri</button><button data-r="-1.5708">Kanan</button></div>
<small id="szt">Select size</small><div class="sz" id="sz"></div><button id="add">Add to cart</button><a id="vc" hidden>View cart →</a></div>
<div id="sheet" hidden><div><h1>Keranjang</h1><div id="cl2"></div><a id="co" class="b p" target="_blank" rel="noopener">Checkout di web utama →</a> <button id="cx">Tutup</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="core.js"></script>
<script>
const MAIN='https://fucktherules.my.id',$=s=>document.querySelector(s),V=THREE.Vector3,esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
rp=v=>{const d=String(v||'').replace(/\D/g,'');return d?'Rp '+(+d).toLocaleString('id-ID'):String(v||'')};
const R=new THREE.WebGLRenderer({antialias:true,canvas:$('#c')});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,60);sc.background=new THREE.Color('#0c1113');sc.fog=new THREE.Fog('#0c1113',9,20);
LK.room(sc);sc.add(new THREE.HemisphereLight('#cfe3ff','#2a2018',.7));
const C=new THREE.OrbitControls(cam,$('#c'));cam.position.set(0,2.1,4.4);C.target.set(0,1.7,0);C.enableDamping=true;C.enablePan=false;C.minDistance=1;C.maxDistance=6;C.minPolarAngle=.7;C.maxPolarAngle=1.85;
let P=[],mode='store',zn=null,sel=null,ry=0,tw=null,cart=[];try{cart=JSON.parse(localStorage.lkc||'[]')}catch(e){}
const Z={};[['hoodie','HOODIE',-3.8,-3.6,0],['kaos','KAOS',3.8,-3.6,0],['aksesoris','AKSESORIS',-5.9,0,Math.PI/2]].forEach(([t,l,x,z,r])=>Z[t]={g:LK.zone(sc,l,x,z,r),items:[],zx:0,sp:.7});
const imgs={},gi=p=>imgs[p.id]??=new Promise(r=>{if(!p.img&&!p.data)return r(LK.demo());const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(LK.demo());i.src=p.data||p.img});
const blob=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,4,64,64,62);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false})})();
async function build(){for(const t in Z){const z=Z[t],L=P.filter(p=>p.type==t),n=L.length;z.sp=Math.min(.7,6.4/Math.max(n,1));
 for(let i=0;i<n;i++){const p=L[i],g=LK.garment(p,await gi(p)),h=LK.hanger(),o=new THREE.Group(),b=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.5),blob);
  LK.tint(g,LK.colors(p.colors)[0].h);h.position.y=g.userData.top;b.position.set(0,-.05,-.55);b.userData.keep=1;o.add(g,h,b);
  o.userData={p,g,x:(i-(n-1)/2)*z.sp,ci:0};o.scale.setScalar(.62);z.g.add(o);z.items.push(o)}}}
const fade=(o,a)=>o.traverse(m=>{if(m.material&&!m.userData.keep){m.material.transparent=true;m.material.opacity=a}});
function fly(pos,tgt,ms=1000){const p0=cam.position.clone(),t0=C.target.clone(),s=performance.now();tw=()=>{const k=Math.min(1,(performance.now()-s)/ms),e=1-Math.pow(1-k,3);cam.position.lerpVectors(p0,pos,e);C.target.lerpVectors(t0,tgt,e);return k<1}}
const tabs=t=>[...$('#nav').children].forEach(b=>b.classList.toggle('on',b.dataset.t==t));
function go(t){sc.updateMatrixWorld(true);if(sel){Object.values(Z).forEach(z=>z.items.forEach(o=>fade(o,1)));sel=null}
 $('#card').classList.remove('on');mode=t=='store'?'store':'zone';zn=t=='store'?null:t;tabs(t);
 if(t=='store'){fly(new V(0,2.1,4.4),new V(0,1.7,0));C.enableRotate=C.enableZoom=true}
 else{const z=Z[t];z.zx=0;fly(z.g.localToWorld(new V(0,1.85,2.7)),z.g.localToWorld(new V(0,1.7,0)));C.enableRotate=C.enableZoom=false}}
function fill(o){const p=o.userData.p,cs=LK.colors(p.colors),sz=(p.sizes??(p.type=='aksesoris'?'':'S/M/L/XL/XXL')).split('/').filter(Boolean);
 $('#k').textContent=p.type;$('#n').textContent=p.name;$('#p').textContent=rp(p.price);$('#l').textContent=cs[0].n;
 $('#sw').innerHTML=cs.map((c,i)=>`<i data-i="${i}" title="${esc(c.n)}" style="background:${c.h}" class="${i?'':'on'}"></i>`).join('');
 $('#sz').innerHTML=sz.map((s,i)=>`<button class="${i?'':'on'}">${esc(s)}</button>`).join('');$('#szt').hidden=!sz.length;
 $('#add').textContent='Add to cart';$('#add').className='';$('#vc').hidden=true;[...$('#vw').children].forEach((b,i)=>b.classList.toggle('on',!i))}
function open(o){const p=o.userData.p,z=Z[p.type];sc.updateMatrixWorld(true);sel=o;mode='item';zn=p.type;ry=0;o.userData.g.rotation.y=0;
 Object.values(Z).forEach(q=>q.items.forEach(i=>fade(i,i===o?1:.22)));
 const top=o.userData.g.userData.top,x=o.userData.x,dn=innerWidth<700?-.5:0;
 fly(z.g.localToWorld(new V(x,1.8+dn*.5,1.9)),z.g.localToWorld(new V(x,2.31-top+dn,0)));C.enableRotate=C.enableZoom=true;tabs(p.type);fill(o);$('#card').classList.add('on')}
const step=d=>{const L=Z[zn].items,i=L.indexOf(sel);open(L[(i+d+L.length)%L.length])};
$('#nx').onclick=()=>step(1);$('#pv').onclick=()=>step(-1);$('#x').onclick=()=>go(zn);
$('#nav').onclick=e=>{const b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)};$('#i').onclick=()=>$('#tip').hidden=!$('#tip').hidden;
$('#vw').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('#vw').children].forEach(x=>x.classList.toggle('on',x==b));ry=+b.dataset.r};
$('#sw').onclick=e=>{const i=e.target.closest('i');if(!i||!sel)return;const c=LK.colors(sel.userData.p.colors)[+i.dataset.i];sel.userData.ci=+i.dataset.i;LK.tint(sel.userData.g,c.h);[...$('#sw').children].forEach(x=>x.classList.toggle('on',x==i));$('#l').textContent=c.n};
$('#sz').onclick=e=>{const b=e.target.closest('button');if(b)[...$('#sz').children].forEach(x=>x.classList.toggle('on',x==b))};
const sv=()=>{try{localStorage.lkc=JSON.stringify(cart)}catch(e){}$('#ct').textContent=cart.length};
$('#add').onclick=()=>{if(!sel)return;const p=sel.userData.p,s=$('#sz .on');cart.push({n:p.name,c:LK.colors(p.colors)[sel.userData.ci].n,s:s?s.textContent:'',pr:p.price,l:p.link||''});sv();$('#add').textContent='Added to cart ✓';$('#add').className='ok';$('#vc').hidden=false};
const sheet=()=>{$('#cl2').innerHTML=cart.map(c=>`<div class="ci"><span>${esc(c.n)}<br><small>${esc(c.c)}${c.s?' · '+esc(c.s):''}</small></span><span>${rp(c.pr)}</span></div>`).join('')||'Keranjang kosong';$('#co').href=(cart.find(c=>c.l)||{l:MAIN}).l;$('#sheet').hidden=false};
$('#cb').onclick=$('#vc').onclick=sheet;$('#cx').onclick=()=>$('#sheet').hidden=true;
function zpan(dx){const z=Z[zn],m=(z.items.length-1)/2*z.sp,n=Math.max(-m,Math.min(m,z.zx+dx));dx=n-z.zx;z.zx=n;const d=new V(1,0,0).applyQuaternion(z.g.quaternion).multiplyScalar(dx);cam.position.add(d);C.target.add(d)}
let dn=null;const cv=$('#c'),rc=new THREE.Raycaster();
cv.onpointerdown=e=>dn={x:e.clientX,y:e.clientY,lx:e.clientX};
cv.onpointermove=e=>{if(!dn)return;if(mode=='zone'&&!tw)zpan(-(e.clientX-dn.lx)*.006);dn.lx=e.clientX};
cv.onpointerup=e=>{const d=dn;dn=null;if(!d||Math.hypot(e.clientX-d.x,e.clientY-d.y)>6)return;
 rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},cam);
 const h=rc.intersectObjects(Object.values(Z).flatMap(z=>z.items),true)[0];
 if(h){let o=h.object;while(o&&!o.userData.p)o=o.parent;if(o)return open(o)}if(mode=='item')go(zn)};
cv.addEventListener('wheel',e=>{if(mode=='zone')zpan((e.deltaY+e.deltaX)*.003)},{passive:true});
function size(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
let lt='';R.setAnimationLoop(()=>{if(tw&&!tw())tw=null;
 for(const k in Z){const z=Z[k];z.items.forEach(o=>{let s=.62;if(mode=='zone'&&k==zn)s+=.14*Math.max(0,1-Math.abs(o.userData.x-z.zx)/.55);if(o===sel)s=1;o.scale.setScalar(o.scale.x+(s-o.scale.x)*.14);o.position.y=2.31-o.userData.g.userData.top*o.scale.x})}
 let n='';if(mode=='zone'){const z=Z[zn],o=z.items.find(o=>Math.abs(o.userData.x-z.zx)<.3);if(o)n=o.userData.p.name}
 if(n!=lt)$('#lab').textContent=lt=n;
 if(sel){const g=sel.userData.g;g.rotation.y+=Math.atan2(Math.sin(ry-g.rotation.y),Math.cos(ry-g.rotation.y))*.12}
 C.update();R.render(sc,cam)});
(async()=>{try{if(location.hash=='#preview')P=JSON.parse(localStorage.lk||'[]')}catch(e){}
 if(!P.length)try{P=await(await fetch('products.json?'+Date.now())).json()}catch(e){}
 if(!P.length)['hoodie','kaos','aksesoris'].forEach(t=>['Hitam','Navy','Maroon','Abu','Cream','Hijau'].forEach((c,i)=>P.push({id:t+i,name:`Demo ${t} ${c}`,type:t,price:'150000',colors:c+'/Putih/Hitam'})));
 await build();$('#ct').textContent=cart.length})();
</script></body></html>
