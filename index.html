<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FVCKTHERULES — 3D Showroom</title>
<link rel="icon" href="https://fucktherules.my.id/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#eeece6;--ink:#14130e;--y:#f6c800}*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:14px Inter,system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button{font:inherit;cursor:pointer}.pill{border:0;border-radius:99px;padding:9px 16px;background:#fff;color:var(--ink);font-weight:600}.pill.on{background:var(--ink);color:#fff}
header{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.brand{font:700 28px Gaegu,cursive}.brand small{font:600 11px Inter;opacity:.6;margin-left:6px}
#tabs,#sub{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);max-width:96vw;overflow-x:auto}
#tabs{bottom:max(16px,env(safe-area-inset-bottom))}#sub{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 52px)}
#card{position:fixed;right:16px;top:70px;width:310px;background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 40px #0002}
#card h3{margin:2px 0 6px;font-size:18px}#card small{opacity:.6}.bd{font-size:11px;background:var(--y);padding:2px 8px;border-radius:99px;font-weight:700}
.sz{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.sz button{padding:9px 14px;border:1px solid #ddd;border-radius:10px;background:#fff;font-weight:600}.sz .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.add{width:100%;border:0;border-radius:99px;padding:14px;background:var(--ink);color:#fff;font-weight:700}.add:disabled{opacity:.4}.add.ok{background:#1f9d55}
#sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center}#sheet.on{display:flex}
#sb{background:var(--bg);width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}
#sb input{width:100%;padding:11px;border:1px solid #d8d4c8;border-radius:12px;margin:4px 0;font:inherit;background:#fff}
.ln{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #0001}.ln span{flex:1}.ln small{display:block;opacity:.6}.ln button{border:0;background:none;font-size:16px}
.er{color:#c0392b;min-height:18px}#empty{position:fixed;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:.6;padding:30px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:640px){#card{left:12px;right:12px;top:auto;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 56px);width:auto}#sub{display:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<header><div class="brand">fvcktherules<small>3D SHOWROOM</small></div><button class="pill" id="bag">Tas <b id="n">0</b></button></header>
<div id="empty" hidden>Belum ada produk di rak ini.<br>Atur dulu lewat admin3d.html</div>
<aside id="card" hidden></aside><div id="sub" hidden></div><nav id="tabs"></nav>
<div id="sheet"><div id="sb"></div></div><div id="toast"></div>
<script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {build} from './models.js';
import * as FB from 'https://fucktherules.my.id/firebase.js?v=20261030';
import {collection,onSnapshot} from 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),rp=n=>'Rp '+n.toLocaleString('id-ID'),num=s=>+String(s||'').replace(/\D/g,'')||0,list=s=>String(s||'').split('/').map(x=>x.trim()).filter(Boolean),cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const RAIL=1.75,GAP=.85,PAY='Mandiri 1370023790229 · GoPay 081910421976 a.n. Dias Adhitya Purnama Putra';
let P=[],A=[],D={},STK=[],items=[],G=[],tab='all',sub='',sel=null,tx=0,cx=0,maxX=0,pc='',ps='',busy=0;
let cart=(()=>{try{return JSON.parse(localStorage.getItem('fvck3d.cart'))||[]}catch{return[]}})();
const save=()=>{try{localStorage.setItem('fvck3d.cart',JSON.stringify(cart))}catch{}$('#n').textContent=cart.length};save();
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};

// ---------- scene ----------
const cv=$('#c'),R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.toneMapping=T.ACESFilmicToneMapping;R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const S=new T.Scene();S.background=new T.Color('#eeece6');S.environment=new T.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;
const cam=new T.PerspectiveCamera(38,1,.1,60);cam.position.set(0,1.3,3.4);
const sun=new T.DirectionalLight('#fff',1.8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-6,right:6,top:4,bottom:-3,far:20});sun.shadow.bias=-.0004;S.add(sun,sun.target,new T.HemisphereLight('#fff','#ddd',.5));
const M=(c,r,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const fl=new T.Mesh(new T.PlaneGeometry(90,16),M('#d9d7d1',.3)),wl=new T.Mesh(new T.PlaneGeometry(90,7),M('#f5f4f0',.95)),rl=new T.Mesh(new T.CylinderGeometry(.012,.012,90,12),M('#c9ccd0',.25,1));
fl.rotation.x=-Math.PI/2;fl.position.x=35;fl.receiveShadow=true;wl.position.set(35,3.5,-1);wl.receiveShadow=true;rl.rotation.z=Math.PI/2;rl.position.set(35,RAIL+.045,0);
const sc=document.createElement('canvas');sc.width=1024;sc.height=160;const sx=sc.getContext('2d');sx.font='700 118px Inter,sans-serif';sx.fillStyle='#14130e';sx.textAlign='center';sx.fillText('FVCKTHERULES',512,120);
const tex=new T.CanvasTexture(sc);tex.colorSpace=T.SRGBColorSpace;const sg=new T.Mesh(new T.PlaneGeometry(3.2,.5),new T.MeshBasicMaterial({map:tex,transparent:true}));sg.position.set(1,2.9,-.98);
S.add(fl,wl,rl,sg);
const dist=()=>sel?(innerWidth<640?1.75:1.6):(innerWidth<640?3.9:3.1);
const rs=()=>{R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener('resize',rs);rs();
R.setAnimationLoop(t=>{cx+=(tx-cx)*.08;const ox=sel?(innerWidth<640?0:.28):0,ly=sel&&innerWidth<640?1.0:1.25;
  cam.position.x=cx+ox;cam.position.y+=(ly+.05-cam.position.y)*.08;cam.position.z+=(dist()-cam.position.z)*.08;cam.lookAt(cx+ox,ly,0);
  sun.position.set(cx+2,5,4);sun.target.position.set(cx,1,0);
  G.forEach((g,i)=>{if(g!==sel){g.rotation.y*=.9;g.rotation.z=Math.sin(t/900+i)*.012}else g.rotation.z*=.9});R.render(S,cam)});

// ---------- data (nyambung ke web utama) ----------
function merge(){
  items=[...P.map(p=>({...p,src:'produk'})),...A.map(p=>({...p,src:'aksesoris'}))].filter(p=>D[p.id]&&D[p.id].tampil!==false)
   .map(p=>({...p,...D[p.id],id:p.id,price:num(p.harga),sizes:p.src=='aksesoris'?[]:list(p.stok),colors:list(p.warna),sold:p.badge=='sold'}))
   .sort((a,b)=>(a.urut||0)-(b.urut||0));layout()}
FB.listenProduk(l=>{P=l;merge()});FB.listenAksesoris(l=>{A=l;merge()},()=>{});FB.listenStok(l=>STK=l);
onSnapshot(collection(FB.db,'produk3d'),s=>{D={};s.forEach(d=>D[d.id]=d.data());merge()},()=>toast('Gagal baca produk3d — publish firestore.rules dulu'));

function layout(){
  G.forEach(g=>S.remove(g));G=[];sel=null;$('#card').hidden=true;
  const L=items.filter(i=>(tab=='all'||i.kategori==tab)&&(tab!='kaos'||!sub||i.subtipe==sub));
  L.forEach((it,i)=>{const g=new T.Group();g.position.set(i*GAP,RAIL,0);g.userData.it=it;S.add(g);G.push(g);
    build(it).then(m=>{if(it.sold)m.traverse(o=>o.material?.color?.multiplyScalar(.45));g.add(m)}).catch(e=>console.error(e))});
  maxX=Math.max(0,(L.length-1)*GAP);tx=cl(tx,0,maxX);$('#empty').hidden=L.length>0}

// ---------- tabs ----------
function tabs(){const T4=[['all','Store'],['jaket','Jaket'],['kaos','Kaos'],['aksesoris','Aksesoris']];
  $('#tabs').innerHTML=T4.map(([k,l])=>`<button class="pill ${tab==k?'on':''}" data-t="${k}">${l}</button>`).join('');
  const s=$('#sub');s.hidden=tab!='kaos';s.innerHTML=[['','Semua'],['lengan-pendek','Lengan pendek'],['lengan-panjang','Lengan panjang']].map(([k,l])=>`<button class="pill ${sub==k?'on':''}" data-u="${k}">${l}</button>`).join('')}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;sub='';tx=0;tabs();layout()}};
$('#sub').onclick=e=>{const b=e.target.closest('[data-u]');if(b){sub=b.dataset.u;tx=0;tabs();layout()}};tabs();

// ---------- interaksi ----------
let drag=null;const ray=new T.Raycaster();
cv.onpointerdown=e=>{drag={x:e.clientX,m:0};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.x=e.clientX;drag.m+=Math.abs(dx);if(sel)sel.rotation.y+=dx*.01;else tx=cl(tx-dx*.006*(dist()/3),0,maxX)};
cv.onpointerup=e=>{if(drag&&drag.m<6){ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
  const h=ray.intersectObjects(G,true)[0];let o=h?.object;while(o&&!o.userData.it)o=o.parent;if(o)pick(o);else{sel=null;$('#card').hidden=true}}drag=null};
cv.onwheel=e=>{tx=cl(tx+e.deltaY*.003,0,maxX)};
function pick(g){sel=g;tx=g.position.x;const it=g.userData.it;pc=it.colors[0]||'-';ps='';card(it)}
function card(it){const c=$('#card');c.hidden=false;
  c.innerHTML=`<small>${esc(it.kategori)}${it.subtipe?' · '+esc(it.subtipe.replace(/-/g,' ')):''}</small><h3>${esc(it.nama)}</h3><b>${rp(it.price)}</b> <span class="bd">${esc({pre:'PRE ORDER',ready:'READY',sold:'SOLD OUT'}[it.badge]||it.status||'')}</span>
  ${it.colors.length>1?`<div class="sz">${it.colors.map(x=>`<button data-c="${esc(x)}" class="${x==pc?'on':''}">${esc(x)}</button>`).join('')}</div>`:`<p><small>${esc(it.warna||'')}</small></p>`}
  ${it.sizes.length?`<small>Pilih ukuran</small><div class="sz">${it.sizes.map(x=>`<button data-s="${esc(x)}" class="${x==ps?'on':''}">${esc(x)}</button>`).join('')}</div>`:''}
  <button class="add" ${it.sold?'disabled':''}>${it.sold?'Sold out':'Add to Cart'}</button><p><small>Drag untuk memutar produk · klik area kosong untuk kembali</small></p>`;
  c.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c){pc=b.dataset.c;card(it)}else if(b.dataset.s){ps=b.dataset.s;card(it)}else if(b.classList.contains('add')){
    if(it.sizes.length&&!ps)return toast('Pilih ukuran dulu');
    cart.push({id:it.id,nama:it.nama,warna:pc||'-',size:ps||'-',harga:it.price,src:it.src,badge:it.badge,kodePrefix:it.kodePrefix||'',dpAllowed:it.dpAllowed||''});save();
    b.textContent='Added to cart ✓';b.classList.add('ok');setTimeout(()=>{b.textContent='Add to Cart';b.classList.remove('ok')},1400)}}}

// ---------- tas & checkout (alur sama dengan web utama: bayar -> bukti -> saveOrder 'pending') ----------
const sh=$('#sheet'),sb=$('#sb');
$('#bag').onclick=()=>{bag();sh.classList.add('on')};
function bag(){const sub=cart.reduce((a,c)=>a+c.harga,0);
  sb.innerHTML=`<h3>Tas (${cart.length})</h3>`+(cart.length?cart.map((c,i)=>`<div class="ln"><span>${esc(c.nama)}<small>${esc(c.warna)} · ${esc(c.size)}</small></span><b>${rp(c.harga)}</b><button data-x="${i}">✕</button></div>`).join('')+
  `<p><b>Subtotal ${rp(sub)}</b><br><small>Ongkir dikonfirmasi admin lewat WhatsApp setelah pesanan masuk.</small></p>
  <input id="f1" placeholder="Nama"><input id="f2" placeholder="No. WhatsApp" inputmode="tel"><input id="f3" placeholder="Email" type="email"><input id="f4" placeholder="Alamat lengkap, kota, kode pos">
  <p><small>Bayar ke: ${PAY}<br><a href="https://fucktherules.my.id/qris.jpg" target="_blank">Buka QRIS</a> · lalu upload bukti bayar:</small></p><input id="f5" type="file" accept="image/*">
  <p class="er" id="er"></p><button class="add" id="go">Kirim pesanan</button>`:'<p>Tas kosong.</p>')+`<p><button class="pill" id="cx">Tutup</button></p>`}
sh.onclick=async e=>{
  if(e.target===sh||e.target.id=='cx')return sh.classList.remove('on');
  const x=e.target.dataset?.x;if(x!==undefined){cart.splice(+x,1);save();return bag()}
  if(e.target.id!='go'||busy)return;const er=$('#er'),v=i=>$('#f'+i).value.trim(),file=$('#f5').files[0];
  if(v(1).length<2||num(v(2)).toString().length<9||!/@/.test(v(3))||v(4).length<12)return er.textContent='Lengkapi nama, WhatsApp, email, dan alamat.';
  if(!file)return er.textContent='Upload bukti bayar dulu.';
  busy=1;e.target.disabled=true;e.target.textContent='Mengirim…';er.textContent='';
  try{
    const url=await FB.uploadGambar(file,'bukti');if(!url)throw new Error('Gagal upload bukti, coba lagi.');
    const sub=cart.reduce((a,c)=>a+c.harga,0),flat=cart.map(c=>({nama:c.nama,warna:c.warna,size:c.size,harga:c.harga,tambahan:'',...(c.src=='aksesoris'?{jenis:'aksesoris'}:{})})),pre=cart.filter(c=>c.badge=='pre');
    const o={nama:v(1),wa:v(2),email:v(3),customerUid:null,alamat:v(4),produk:flat,produkText:flat.map(i=>i.jenis=='aksesoris'?i.nama:`${i.nama} (${i.warna}|${i.size})`).join(', '),
      hargaKaos:sub,ongkir:0,voucherKode:'',voucherDeskripsi:'',totalAkhir:sub,tipeBayar:'Cek Bukti Bayar',dp:'',buktiURL:url,dpEligible:cart.some(c=>c.dpAllowed!='no'),
      kodePrefix:(cart.find(c=>c.kodePrefix)||{}).kodePrefix||'',isPO:pre.length>0,poIds:[...new Set(pre.map(c=>c.id))],poNames:[...new Set(pre.map(c=>c.nama))],sumber:'3d-showroom'};
    const tr=cart.filter(c=>c.src=='produk'&&STK.some(s=>s.pid==c.id));
    if(tr.length&&FB.kurangiStok)try{o.stokItems=await FB.kurangiStok(tr.map(c=>({pid:c.id,warna:c.warna,size:c.size})))}catch(err){if(err?.code=='STOK_HABIS'){const h=err.habis?.[0]||{};throw new Error(`Stok ${h.warna||''} ${h.size||''} habis/kurang. Hapus dari tas dulu.`)}throw err}
    const id=await FB.saveOrder(o);if(!id)throw new Error('Gagal menyimpan pesanan.');
    cart=[];save();sb.innerHTML=`<h3>Pesanan terkirim ✓</h3><p>ID pemesanan:<br><b style="font-size:20px">${esc(o.kodePelunasan||id)}</b></p><p>Status: menunggu verifikasi admin. Cek di Pantau Pesanan web utama.</p><button class="pill" id="cx">Tutup</button>`;
  }catch(err){er.textContent=err.message||'Terjadi kesalahan.';e.target.disabled=false;e.target.textContent='Kirim pesanan'}
  busy=0};
</script></body></html>
