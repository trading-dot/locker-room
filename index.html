<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FVCKTHERULES — Rail</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👕</text></svg>">
<style>
:root{--bg:#ececea;--ink:#111;--acc:#39ff14;--W:min(74vw,400px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:700 11px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;user-select:none}
.brand{position:fixed;top:calc(14px + env(safe-area-inset-top));left:16px;font-weight:800;z-index:5}
.count{position:fixed;top:calc(14px + env(safe-area-inset-top));right:16px;opacity:.5;z-index:5}
.stage{position:fixed;inset:0 0 calc(34px + env(safe-area-inset-bottom)) 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding-top:env(safe-area-inset-top)}
.rail{position:relative;width:100%;height:calc(var(--W)*.82 + 56px);flex:none}
.rod{position:absolute;left:0;right:0;top:0;height:2px;background:#8d8d8a}
.item{position:absolute;left:50%;top:0;width:var(--W);transform-origin:50% 0;transition:transform .55s cubic-bezier(.2,.8,.2,1),filter .55s,opacity .55s;cursor:pointer}
.tt{position:relative;margin-top:40px;aspect-ratio:1/1;width:100%}
.tt-h{position:absolute;left:50%;top:-40px;width:42%;aspect-ratio:200/120;transform:translateX(-50%);z-index:0}
.tt-h svg{display:block;width:100%;height:100%}
.tt-stack{position:absolute;inset:0;z-index:1;transform-origin:50% 0;pointer-events:none}
.tt-v{position:absolute;inset:0;background-repeat:no-repeat;filter:drop-shadow(0 14px 14px rgba(0,0,0,.12))}
.info{text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;max-width:92vw}
.info h1{font-size:13px;font-weight:800}.price{opacity:.55}
.pill{display:flex;border:1px solid var(--ink);border-radius:99px;overflow:hidden}
.pill button,.btn{font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;color:var(--ink);padding:7px 14px;cursor:pointer}
.pill button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center;justify-content:center}
.rot{border:1px solid var(--ink)!important;border-radius:50%;width:28px;height:28px;padding:0!important}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid #0006;padding:0;cursor:pointer;outline-offset:3px}
.sw.on{outline:2px solid var(--ink)}
.btn{border:1px solid var(--ink);border-radius:99px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--ink);color:var(--bg)}
.nav{position:fixed;top:38%;font-size:22px;background:none;border:0;padding:14px;cursor:pointer;color:var(--ink);opacity:.45;z-index:5}
.nav.l{left:2px}.nav.r{right:2px}
.ticker{position:fixed;left:0;right:0;bottom:0;height:calc(34px + env(safe-area-inset-bottom));background:var(--acc);overflow:hidden;display:flex;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.ticker div{white-space:nowrap;animation:mq 28s linear infinite;font-size:10px}
@keyframes mq{to{transform:translateX(-50%)}}
.hint{opacity:.4;font-size:10px}
@media (max-height:700px){:root{--W:min(56vw,300px)}}
@media (prefers-reduced-motion:reduce){.ticker div{animation:none}.item{transition:none}}
</style>
</head>
<body>
<div class="brand">FVCKTHERULES</div><div class="count" id="count"></div>
<button class="nav l" id="prev" aria-label="Sebelumnya">←</button><button class="nav r" id="next" aria-label="Berikutnya">→</button>
<div class="stage">
  <div class="rail" id="rail"><div class="rod"></div></div>
  <div class="info">
    <h1 id="name">Memuat…</h1><div class="price" id="price"></div>
    <div class="pill" id="pill"><button data-a="0" class="on">Depan</button><button data-a="180">Belakang</button></div>
    <div class="row"><button class="btn rot" id="rl" aria-label="Putar kiri">↺</button><div class="row" id="sws"></div><button class="btn rot" id="rr" aria-label="Putar kanan">↻</button></div>
    <a class="btn" id="go" target="_blank" rel="noopener">Lihat ketersediaan ↗</a>
    <div class="hint">geser baju untuk memutar 360°</div>
  </div>
</div>
<div class="ticker"><div id="mq"></div></div>

<script type="module">
import { Turntable, mockupUrl } from './rail-core.js';
// ===== PENGATURAN =====
const MAIN = 'https://fucktherules.my.id';
const FB_URL = MAIN + '/firebase.js?v=20261030';
const FS_URL = 'https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js';
const TICKER = 'NEW DROPS • JAKARTA • FVCKTHERULES • PRE-ORDER OPEN • ';

const $ = s => document.querySelector(s), rail = $('#rail');
$('#mq').textContent = TICKER.repeat(12);
let items = [], cur = 0;                       // items: {p, tt, el, ci}

const link = p => p.pid && !String(p.pid).startsWith('demo') ? `${MAIN}/#${p.pid}` : MAIN;

function build(list) {
  rail.querySelectorAll('.item').forEach(e => e.remove());
  items = list.map((p, i) => {
    const el = document.createElement('div'); el.className = 'item';
    const host = document.createElement('div'); el.appendChild(host);
    const tt = new Turntable(host, { tipe: p.tipe, scale: p.scale, y: p.y, atlas: p.warna[0].atlas });
    tt.onturn = () => { if (items[cur]?.tt === tt) syncPill(); };
    el.onclick = e => { if (i !== cur) go(i); };
    rail.appendChild(el); return { p, tt, el, ci: 0 };
  });
  cur = Math.min(cur, items.length - 1); go(cur);
}
function go(i) {
  if (!items.length) return;
  cur = (i + items.length) % items.length;
  const gap = Math.min(innerWidth * .36, 250);
  items.forEach((it, k) => {
    const o = k - cur, a = Math.abs(o), c = !a;
    it.el.style.transform = `translateX(calc(-50% + ${o * gap}px)) scale(${c ? 1 : .6})`;
    it.el.style.filter = c ? 'none' : `blur(${Math.min(a * 2 + 3, 9)}px)`;
    it.el.style.opacity = a > 2 ? 0 : c ? 1 : .8; it.el.style.zIndex = 10 - a; it.el.style.pointerEvents = a > 2 ? 'none' : 'auto';
    if (!c) { it.tt.rotateTo(0); }
    if (c && !it.drag) { it.tt.enableDrag(); it.drag = true; }
  });
  const it = items[cur], p = it.p;
  $('#name').textContent = p.nama || ''; $('#price').textContent = p.harga || '';
  $('#go').href = link(p); $('#count').textContent = `${cur + 1}/${items.length}`;
  const sw = $('#sws'); sw.innerHTML = '';
  p.warna.forEach((w, k) => {
    const b = document.createElement('button'); b.className = 'sw' + (k === it.ci ? ' on' : ''); b.style.background = w.hex || '#999'; b.title = w.nama || '';
    b.onclick = () => { it.ci = k; it.tt.set({ atlas: w.atlas }); go(cur); };
    sw.appendChild(b);
  });
  $('#sws').style.display = p.warna.length > 1 ? 'flex' : 'none';
  syncPill();
}
function syncPill() {
  const v = items[cur].tt.view;
  document.querySelectorAll('#pill button').forEach(b => b.classList.toggle('on', (b.dataset.a === '0' && v === 'depan') || (b.dataset.a === '180' && v === 'belakang')));
}
document.querySelectorAll('#pill button').forEach(b => b.onclick = () => items[cur].tt.rotateTo(+b.dataset.a));
$('#rl').onclick = () => items[cur].tt.rotateBy(-90); $('#rr').onclick = () => items[cur].tt.rotateBy(90);
$('#prev').onclick = () => go(cur - 1); $('#next').onclick = () => go(cur + 1);
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(cur - 1); if (e.key === 'ArrowRight') go(cur + 1); });
let wl = 0; addEventListener('wheel', e => { const n = Date.now(); if (n - wl < 350) return; const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (Math.abs(d) < 8) return; wl = n; go(cur + (d > 0 ? 1 : -1)); }, { passive: true });
let sx = null; addEventListener('pointerdown', e => sx = e.target.closest('.item') === items[cur]?.el ? null : e.clientX);
addEventListener('pointerup', e => { if (sx == null) return; const d = e.clientX - sx; sx = null; if (Math.abs(d) > 40) go(cur + (d < 0 ? 1 : -1)); });
addEventListener('resize', () => go(cur));

// ---- contoh dulu (kalau belum ada yang diatur di admin / Firestore gagal) ----
const DEMO = [['kaos', 'Kaos lengan pendek'], ['kaos-panjang', 'Kaos lengan panjang'], ['hoodie', 'Hoodie'], ['aksesoris', 'Tote bag']].map(([t, n], i) =>
  ({ pid: 'demo' + i, nama: n + ' (contoh)', harga: 'Rp 189.000', tipe: t, scale: 1, y: 0,
     warna: [{ nama: 'Hitam', hex: '#111111', atlas: mockupUrl(t, 'hitam') }, { nama: 'Putih', hex: '#f2f2f0', atlas: mockupUrl(t, 'putih') }] }));
build(DEMO);

try {
  const fb = await import(FB_URL), fs = await import(FS_URL);
  let prods = {}, cfgs = [];
  const render = () => {
    const l = cfgs.filter(c => c.aktif !== false && c.warna?.length && prods[c.pid])
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).map(c => ({ ...c, nama: prods[c.pid].nama, harga: prods[c.pid].harga }));
    if (l.length) build(l);
  };
  fb.listenProduk(list => { prods = Object.fromEntries(list.map(p => [p.id, p])); render(); });
  fs.onSnapshot(fs.collection(fb.db, 'rail'), s => { cfgs = s.docs.map(d => ({ pid: d.id, ...d.data() })); render(); });
} catch (e) { console.warn('Firestore gagal, tampilkan contoh', e); }
</script>
</body>
</html>
