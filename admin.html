<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Locker 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="ui.css">
<style>body{padding:14px;max-width:1000px;margin:auto}h2{font-size:13px;letter-spacing:.14em;color:var(--o);margin:16px 0 6px;text-transform:uppercase}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.g{grid-template-columns:1fr}}
.l{display:flex;flex-direction:column;gap:4px;max-height:230px;overflow:auto}.l button{display:flex;justify-content:space-between;text-align:left;font:inherit;color:var(--t);background:#ffffff0d;border:1px solid #fff1;padding:9px 12px;border-radius:8px;cursor:pointer}.l button.on{border-color:var(--o)}
label{display:block;color:var(--g);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:8px 0 3px}
input,select{width:100%;font:inherit;color:var(--t);background:#ffffff0d;border:1px solid #fff2;border-radius:8px;padding:9px}
#pvw{height:320px;border-radius:12px;background:#151b1e;overflow:hidden}.r{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#t{color:var(--o);min-height:20px;margin-top:6px}</style></head><body>
<h1 style="font-weight:800;letter-spacing:.1em">ADMIN · LOCKER ROOM 3D</h1>
<div class="g"><div><h2>1 · Produk di web utama</h2><div class="l" id="main">Memuat…</div>
<h2>2 · Tampil di locker room</h2><div class="l" id="mine"></div></div>
<div><h2>3 · Atur produk</h2><div id="ed" hidden>
<div id="pvw"></div><div class="pill" id="vw" style="margin-top:8px;justify-content:center"><button data-r="0" class="on">Depan</button><button data-r="3.1416">Belakang</button><button data-r="1.5708">Kiri</button><button data-r="-1.5708">Kanan</button></div>
<label>Jenis</label><select id="ty"><option value="kaos">Kaos</option><option value="hoodie">Hoodie</option><option value="aksesoris">Aksesoris (tote)</option></select>
<label>Warna (pisah /, boleh Nama:#hex)</label><input id="co"><label>Ukuran (pisah /, kosongkan untuk aksesoris)</label><input id="sz"><label>Link beli</label><input id="lk" placeholder="https://…">
<label>Gambar desain (PNG 2048×512: depan | belakang | kiri | kanan)</label><input id="fi" type="file" accept="image/png,image/webp">
<div class="r"><a class="b" href="img/template-desain.png" download>Template</a><button class="b" id="dl">Unduh gambar</button><button class="b" id="rm">Hapus</button></div></div></div></div>
<h2>4 · Simpan</h2><div class="r"><button class="b p" id="sv">Simpan &amp; preview</button><button class="b" id="ex">Unduh products.json</button><a class="b" href="index.html#preview" target="_blank">Buka preview</a></div>
<div id="t"></div>
<p style="color:var(--g);margin-top:14px;font-size:13px">Preview tersimpan di browser ini. Agar tampil di web publik: taruh <b>products.json</b> di folder ini dan semua gambar di folder <b>img/</b>, lalu commit ke GitHub.</p>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="core.js"></script>
<script>
const $=s=>document.querySelector(s),K='AIzaSyCVL_C4opQiKC6fNG_Rw4l-519rQZICH58',v=f=>f&&(f.stringValue??f.integerValue??f.doubleValue)||'';
let L=[];try{L=JSON.parse(localStorage.lk||'[]')}catch(e){}let s=null,g=null;
const toast=m=>{$('#t').textContent=m;setTimeout(()=>$('#t').textContent='',4000)};
const list=()=>{$('#mine').innerHTML=L.map(p=>`<button data-i="${p.id}" class="${s&&s.id==p.id?'on':''}"><span>${p.name}</span><span>${p.type}</span></button>`).join('')||'<small style="color:var(--g)">Belum ada — pilih dari daftar atas.</small>'};
(async()=>{const o=[];for(const c of['produk','aksesoris'])try{const j=await(await fetch(`https://firestore.googleapis.com/v1/projects/fvcktherules-store/databases/(default)/documents/${c}?pageSize=200&key=${K}`)).json();
 (j.documents||[]).forEach(d=>{const f=d.fields||{},n=v(f.nama);o.push({id:d.name.split('/').pop(),name:n,price:String(v(f.harga)),type:c=='aksesoris'?'aksesoris':/hood|zip|jaket|sweat/i.test(n)?'hoodie':'kaos',colors:v(f.warna)||'Hitam/Putih',link:''})})}catch(e){}
 $('#main').innerHTML=o.length?'':'Gagal memuat produk (cek koneksi / rules).';o.forEach(p=>{const b=document.createElement('button');b.innerHTML=`<span>${p.name}</span><span>+ tambah</span>`;b.onclick=()=>{if(!L.find(x=>x.id==p.id))L.push({...p,img:`img/${p.id}.png`});pickP(p.id)};$('#main').append(b)})})();
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.outputEncoding=THREE.sRGBEncoding;R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=false;$('#pvw').append(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,30),C=new THREE.OrbitControls(cam,R.domElement);cam.position.set(0,0,3.6);C.enablePan=false;C.enableDamping=true;
sc.add(new THREE.HemisphereLight('#fff','#556',1),Object.assign(new THREE.DirectionalLight('#fff',.9),{position:new THREE.Vector3(2,3,4)}));
const fit=()=>{const w=$('#pvw').clientWidth||300;R.setSize(w,320);cam.aspect=w/320;cam.updateProjectionMatrix()};addEventListener('resize',fit);
R.setAnimationLoop(()=>{C.update();R.render(sc,cam)});
function img(p){return new Promise(r=>{if(!p.data)return r(p.img?null:LK.demo());const i=new Image();i.onload=()=>r(i);i.src=p.data})}
async function build(){if(!s)return;if(g)sc.remove(g);g=LK.garment(s,await img(s));LK.tint(g,LK.colors(s.colors)[0].h);sc.add(g);fit()}
function pickP(id){s=L.find(x=>x.id==id);$('#ed').hidden=false;$('#ty').value=s.type;$('#co').value=s.colors;$('#lk').value=s.link||'';$('#sz').value=s.sizes??(s.type=='aksesoris'?'':'S/M/L/XL/XXL');list();build()}
$('#mine').onclick=e=>{const b=e.target.closest('button');if(b)pickP(b.dataset.i)};
$('#ty').onchange=()=>{s.type=$('#ty').value;list();build()};$('#co').oninput=()=>{s.colors=$('#co').value;build()};$('#lk').oninput=()=>s.link=$('#lk').value;$('#sz').oninput=()=>s.sizes=$('#sz').value;
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{s.data=r.result;build()};r.readAsDataURL(f)};
$('#vw').onclick=e=>{const b=e.target.closest('button');if(!b||!g)return;[...$('#vw').children].forEach(x=>x.classList.toggle('on',x==b));g.rotation.y=+b.dataset.r};
$('#rm').onclick=()=>{L=L.filter(x=>x!=s);s=null;$('#ed').hidden=true;list()};
const dl=(h,n)=>{const a=document.createElement('a');a.href=h;a.download=n;a.click()};
$('#dl').onclick=()=>s&&s.data?dl(s.data,s.id+'.png'):toast('Upload gambar dulu');
$('#sv').onclick=()=>{try{localStorage.lk=JSON.stringify(L);toast('Tersimpan ✓ — klik "Buka preview"')}catch(e){toast('Penyimpanan penuh, kecilkan gambar')}};
$('#ex').onclick=()=>dl(URL.createObjectURL(new Blob([JSON.stringify(L.map(({data,...p})=>p),null,1)],{type:'application/json'})),'products.json');
list();
</script></body></html>
